<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LearnHub • Chuyển hướng</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  color:white;
}

.card{
  width:min(100%,650px);
  background:#0f172a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:40px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  animation:fadeUp .5s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 20px;
  border-radius:20px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
}

h1{
  font-size:38px;
  margin-bottom:12px;
}

.desc{
  color:#94a3b8;
  line-height:1.7;
  margin-bottom:28px;
}

.link-box{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:18px;
  margin-bottom:24px;
}

.old-link{
  color:#fca5a5;
  word-break:break-all;
}

.arrow{
  font-size:26px;
  margin:10px 0;
  color:#60a5fa;
}

.new-link{
  color:#86efac;
  font-weight:600;
  word-break:break-all;
}

.progress-wrap{
  width:100%;
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:16px;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#3b82f6,#06b6d4);
  animation:load 5s linear forwards;
}

@keyframes load{
  from{width:0%;}
  to{width:100%;}
}

.countdown{
  color:#cbd5e1;
  margin-bottom:24px;
}

.btn{
  display:inline-block;
  text-decoration:none;
  color:white;
  background:#2563eb;
  padding:14px 24px;
  border-radius:14px;
  font-weight:600;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.footer{
  margin-top:20px;
  font-size:13px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">L</div>

  <h1>LearnHub</h1>

  <p class="desc">
    Website đã được chuyển sang địa chỉ mới.<br>
    Bạn sẽ được chuyển hướng tự động trong vài giây.
  </p>

  <div class="link-box">

    <div class="old-link">
      https://kioshuke.github.io/onthi12/
    </div>

    <div class="arrow">↓</div>

    <div class="new-link">
      https://kioshuke.github.io/learnhub/
    </div>

  </div>

  <div class="progress-wrap">
    <div class="progress"></div>
  </div>

  <div class="countdown">
    Tự động chuyển hướng sau <span id="timer">5</span> giây...
  </div>

  <a class="btn" href="https://kioshuke.github.io/learnhub/">
    Truy cập LearnHub ngay
  </a>

  <div class="footer">
    LearnHub • THPT Tân Hồng
  </div>

</div>

<script>
let timeLeft = 5;
const timer = document.getElementById("timer");

const interval = setInterval(() => {

  timeLeft--;
  timer.textContent = timeLeft;

  if(timeLeft <= 0){
    clearInterval(interval);

    document.body.style.transition = "opacity .4s ease";
    document.body.style.opacity = "0";

    setTimeout(() => {
      window.location.replace(
        "https://kioshuke.github.io/learnhub/"
      );
    }, 400);
  }

},1000);
</script>

</body>
</html>
