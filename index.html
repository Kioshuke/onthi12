<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnHub • Redirecting</title>

  <meta http-equiv="refresh" content="5; url=https://kioshuke.github.io/learnhub/" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#020617;
      --card:#0f172a;
      --text:#f8fafc;
      --sub:#94a3b8;
      --blue:#3b82f6;
      --cyan:#06b6d4;
      --purple:#8b5cf6;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 35%),
        radial-gradient(circle at top right, rgba(139,92,246,.15), transparent 35%),
        radial-gradient(circle at bottom, rgba(6,182,212,.12), transparent 40%),
        var(--bg);
      font-family:'Inter',sans-serif;
      color:var(--text);
      position:relative;
    }

    /* animated grid */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size:40px 40px;
      mask-image:radial-gradient(circle at center, black 35%, transparent 80%);
      animation:gridMove 18s linear infinite;
    }

    @keyframes gridMove{
      from{transform:translateY(0px);}
      to{transform:translateY(40px);}
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:.35;
      animation:float 10s ease-in-out infinite;
    }

    .orb.one{
      width:300px;
      height:300px;
      background:var(--blue);
      top:-80px;
      left:-80px;
    }

    .orb.two{
      width:260px;
      height:260px;
      background:var(--purple);
      bottom:-100px;
      right:-60px;
      animation-delay:2s;
    }

    .orb.three{
      width:220px;
      height:220px;
      background:var(--cyan);
      top:40%;
      right:10%;
      animation-delay:4s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px) scale(1);
      }
      50%{
        transform:translateY(-20px) scale(1.08);
      }
    }

    .card{
      width:min(92vw, 560px);
      position:relative;
      z-index:2;
      background:rgba(15,23,42,.72);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(24px);
      border-radius:32px;
      padding:42px 36px;
      text-align:center;
      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation:cardIn .8s cubic-bezier(.22,1,.36,1);
    }

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(25px) scale(.95);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .logo-wrap{
      width:110px;
      height:110px;
      margin:0 auto 24px;
      position:relative;
    }

    .logo-ring{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.08);
      animation:spin 8s linear infinite;
    }

    .logo-ring::before,
    .logo-ring::after{
      content:"";
      position:absolute;
      width:14px;
      height:14px;
      border-radius:50%;
    }

    .logo-ring::before{
      background:var(--blue);
      top:-7px;
      left:50%;
      transform:translateX(-50%);
      box-shadow:0 0 18px var(--blue);
    }

    .logo-ring::after{
      background:var(--cyan);
      bottom:-7px;
      left:50%;
      transform:translateX(-50%);
      box-shadow:0 0 18px var(--cyan);
    }

    @keyframes spin{
      from{transform:rotate(0deg);}
      to{transform:rotate(360deg);}
    }

    .logo{
      position:absolute;
      inset:14px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      font-weight:800;
      box-shadow:
        0 0 35px rgba(59,130,246,.4),
        inset 0 0 20px rgba(255,255,255,.15);
      animation:pulse 3s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.04);
      }
    }

    h1{
      font-size:clamp(32px,5vw,48px);
      font-weight:800;
      margin-bottom:12px;
      background:linear-gradient(135deg,#fff,#93c5fd,#c4b5fd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      letter-spacing:-1px;
    }

    .desc{
      color:var(--sub);
      font-size:15px;
      line-height:1.7;
      margin-bottom:28px;
    }

    .highlight{
      color:#fff;
      font-weight:600;
    }

    .progress-wrap{
      width:100%;
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      overflow:hidden;
      margin-bottom:18px;
      position:relative;
    }

    .progress{
      width:0%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--blue),var(--cyan),var(--purple));
      background-size:200% 100%;
      animation:
        load 5s linear forwards,
        gradientFlow 2s linear infinite;
      box-shadow:0 0 20px rgba(59,130,246,.45);
    }

    @keyframes load{
      from{width:0%;}
      to{width:100%;}
    }

    @keyframes gradientFlow{
      from{background-position:0% 50%;}
      to{background-position:200% 50%;}
    }

    .countdown{
      font-size:14px;
      color:#cbd5e1;
      letter-spacing:.3px;
      margin-bottom:28px;
    }

    .redirect-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 24px;
      border-radius:16px;
      text-decoration:none;
      color:white;
      font-weight:700;
      background:linear-gradient(135deg,var(--blue),#2563eb);
      box-shadow:0 12px 28px rgba(37,99,235,.28);
      transition:.25s ease;
    }

    .redirect-btn:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 18px 40px rgba(37,99,235,.4);
    }

    .footer{
      margin-top:26px;
      font-size:12px;
      color:#64748b;
    }

    @media (max-width:640px){
      .card{
        padding:32px 24px;
        border-radius:26px;
      }

      .logo-wrap{
        width:90px;
        height:90px;
      }

      .logo{
        font-size:30px;
      }
    }
  </style>
</head>
<body>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="card">

    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo">L</div>
    </div>

    <h1>LearnHub</h1>

    <p class="desc">
      Website đã được nâng cấp và chuyển sang nền tảng mới ✨<br>
      Bạn sẽ được chuyển hướng tới <span class="highlight">LearnHub Platform</span> trong vài giây.
    </p>

    <div class="progress-wrap">
      <div class="progress"></div>
    </div>

    <div class="countdown">
      Tự động chuyển hướng sau <span id="timer">5</span>s...
    </div>

    <a class="redirect-btn" href="https://kioshuke.github.io/learnhub/">
      🚀 Truy cập ngay
    </a>

    <div class="footer">
      © 2026 LearnHub • THPT Tân Hồng
    </div>
  </div>

  <script>
    let timeLeft = 5;
    const timer = document.getElementById('timer');

    const countdown = setInterval(() => {
      timeLeft--;
      timer.textContent = timeLeft;

      if(timeLeft <= 0){
        clearInterval(countdown);

        document.body.style.transition = 'opacity .5s ease';
        document.body.style.opacity = '0';

        setTimeout(() => {
          window.location.href = 'https://kioshuke.github.io/learnhub/';
        }, 500);
      }
    }, 1000);
  </script>

</body>
</html>
